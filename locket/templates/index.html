<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locket Gold Test Free</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #FFD700;
            --gold-light: #FFE55C;
            --gold-dark: #FFA500;
            --bg: #0a0a0f;
            --card: rgba(20, 20, 30, 0.7);
            --text: #fff;
            --glass: 1px solid rgba(255,215,0,0.2);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* === BACKGROUND GLOW === */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .25;
            animation: drift 20s ease-in-out infinite alternate;
        }
        .bg-glow .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,215,0,.4), transparent 70%);
            top: -10%;
            left: -5%;
        }
        .bg-glow .orb:nth-child(2) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255,140,0,.25), transparent 70%);
            bottom: -10%;
            right: -5%;
            animation-delay: -8s;
        }
        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            50%  { transform: translate(30px,-20px) scale(1.1); }
            100% { transform: translate(-20px,15px) scale(.95); }
        }

        /* === PARTICLES (light version for weak PC) === */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .particles span {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: particle-float linear infinite;
        }
        @keyframes particle-float {
            0%   { opacity: 0; transform: translateY(100vh) scale(0); }
            10%  { opacity: .5; }
            90%  { opacity: .2; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        /* === MAIN CONTAINER === */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 2rem 1rem;
        }

        /* === HERO TITLE === */
        .hero-title {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease;
        }
        .hero-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255,215,0,.3);
            letter-spacing: 2px;
            line-height: 1.2;
        }
        .hero-title p {
            color: #999;
            margin-top: .5rem;
            font-size: 1rem;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === INPUT CARD === */
        .input-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: var(--glass);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            animation: fadeInUp .8s ease .2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: .75rem;
            font-size: .95rem;
            color: #ccc;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255,255,255,.05);
            border: 2px solid rgba(255,215,0,.3);
            border-radius: 1rem;
            color: var(--text);
            font-size: 1.1rem;
            font-family: inherit;
            transition: all .3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,.08);
            box-shadow: 0 0 0 4px rgba(255,215,0,.1);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        /* === BUTTONS === */
        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s ease;
            text-transform: uppercase;
            letter-spacing: .5px;
            position: relative;
            overflow: hidden;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn-check {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
        }

        .btn-check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79,70,229,.4);
        }

        .btn-unlock {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000;
        }

        .btn-unlock:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255,215,0,.5);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        /* === AVATAR REVEAL === */
        .avatar-reveal {
            display: none;
            text-align: center;
            margin-top: 2rem;
            animation: fadeInScale .6s ease;
        }

        .avatar-reveal.show {
            display: block;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .avatar-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .avatar-ring {
            position: absolute;
            inset: -10px;
            border: 3px solid transparent;
            border-radius: 50%;
            background: linear-gradient(var(--bg), var(--bg)) padding-box,
                        linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold)) border-box;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(255,215,0,.3), transparent 70%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: .5; transform: scale(1); }
            50% { opacity: .8; transform: scale(1.1); }
        }

        .avatar-img {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg);
        }

        .user-info h2 {
            font-size: 1.5rem;
            margin-bottom: .25rem;
        }

        .user-info p {
            color: #999;
            font-size: .9rem;
        }

        /* === SUCCESS SCREEN === */
        .success-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0,0,0,.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn .5s ease;
        }

        .success-screen.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .rocket {
            font-size: 5rem;
            animation: rocketLaunch 2s ease;
        }

        @keyframes rocketLaunch {
            0% {
                transform: translateY(100vh) rotate(45deg) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-50vh) rotate(45deg) scale(1.2);
                opacity: 0;
            }
        }

        .success-message {
            text-align: center;
            padding: 2rem;
            animation: fadeInUp .8s ease .5s both;
        }

        .success-message h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .success-message p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 2rem;
        }

        .btn-close-success {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000;
            padding: 1rem 2rem;
            border: none;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s ease;
        }

        .btn-close-success:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(255,215,0,.5);
        }

        /* === FIREWORKS === */
        .fireworks {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework-explode 1s ease-out;
        }

        @keyframes firework-explode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* === LOADING SPINNER === */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,.3);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* === RESPONSIVE === */
        @media (max-width: 640px) {
            .hero-title h1 {
                font-size: 2rem;
            }
            .input-card {
                padding: 2rem 1.5rem;
            }
            .button-group {
                flex-direction: column;
            }
            button {
                min-width: 100%;
            }
            .success-message h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-glow">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Hero Title -->
        <div class="hero-title">
            <h1>LOCKET GOLD<br>TEST FREE</h1>
            <p>Unlock premium features instantly</p>
        </div>

        <!-- Input Card -->
        <div class="input-card">
            <div class="input-group">
                <label for="username">Locket Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username..."
                    autocomplete="off"
                >
            </div>

            <div class="button-group">
                <button class="btn-check" id="btnCheck">
                    <span id="checkText">Check User</span>
                </button>
                <button class="btn-unlock" id="btnUnlock" disabled>
                    <span id="unlockText">Unlock Gold</span>
                </button>
            </div>

            <!-- Avatar Reveal -->
            <div class="avatar-reveal" id="avatarReveal">
                <div class="avatar-container">
                    <div class="avatar-ring"></div>
                    <img class="avatar-img" id="avatarImg" src="" alt="Avatar">
                </div>
                <div class="user-info">
                    <h2 id="userName"></h2>
                    <p id="userUid"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Screen with Rocket & Fireworks -->
    <div class="success-screen" id="successScreen">
        <div class="fireworks" id="fireworksContainer"></div>
        <div class="rocket">🚀</div>
        <div class="success-message">
            <h1>SUCCESS!</h1>
            <p id="successMessage">Gold unlocked successfully!</p>
            <button class="btn-close-success" id="btnCloseSuccess">Continue</button>
        </div>
    </div>

    <script>
        // === PARTICLE SYSTEM (light version) ===
        const particlesContainer = document.getElementById('particles');
        const PARTICLE_COUNT = 15; // Reduced for weak PC

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const particle = document.createElement('span');
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${8 + Math.random() * 8}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(particle);
        }

        // === MAIN APP LOGIC ===
        const usernameInput = document.getElementById('username');
        const btnCheck = document.getElementById('btnCheck');
        const btnUnlock = document.getElementById('btnUnlock');
        const checkText = document.getElementById('checkText');
        const unlockText = document.getElementById('unlockText');
        const avatarReveal = document.getElementById('avatarReveal');
        const avatarImg = document.getElementById('avatarImg');
        const userName = document.getElementById('userName');
        const userUid = document.getElementById('userUid');
        const successScreen = document.getElementById('successScreen');
        const successMessage = document.getElementById('successMessage');
        const btnCloseSuccess = document.getElementById('btnCloseSuccess');

        let currentUserData = null;

        // Check User
        btnCheck.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            if (!username) {
                alert('Please enter a username');
                return;
            }

            // Loading state
            btnCheck.disabled = true;
            checkText.innerHTML = '<span class="spinner"></span> Checking...';

            try {
                const response = await fetch('/api/get-user-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (data.success) {
                    currentUserData = data.data;

                    // Show avatar reveal
                    avatarImg.src = data.data.profile_picture_url || 'https://via.placeholder.com/120';
                    userName.textContent = `${data.data.first_name} ${data.data.last_name}`.trim() || data.data.username;
                    userUid.textContent = `@${data.data.username}`;

                    avatarReveal.classList.add('show');
                    btnUnlock.disabled = false;
                } else {
                    alert(data.msg || 'User not found');
                    avatarReveal.classList.remove('show');
                    btnUnlock.disabled = true;
                }
            } catch (err) {
                alert('Connection error. Please try again.');
                console.error(err);
            } finally {
                btnCheck.disabled = false;
                checkText.textContent = 'Check User';
            }
        });

        // Unlock Gold
        btnUnlock.addEventListener('click', async () => {
            if (!currentUserData) return;

            const username = usernameInput.value.trim();

            // Loading state
            btnUnlock.disabled = true;
            unlockText.innerHTML = '<span class="spinner"></span> Unlocking...';

            try {
                const response = await fetch('/api/unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (data.success) {
                    // Show success screen with rocket & fireworks
                    successMessage.textContent = data.message;
                    successScreen.classList.add('show');
                    launchFireworks();
                } else {
                    alert(data.message || 'Unlock failed');
                }
            } catch (err) {
                alert('Connection error. Please try again.');
                console.error(err);
            } finally {
                btnUnlock.disabled = false;
                unlockText.textContent = 'Unlock Gold';
            }
        });

        // Close Success Screen
        btnCloseSuccess.addEventListener('click', () => {
            successScreen.classList.remove('show');
            // Reset form
            usernameInput.value = '';
            avatarReveal.classList.remove('show');
            btnUnlock.disabled = true;
            currentUserData = null;
        });

        // === FIREWORKS EFFECT ===
        function launchFireworks() {
            const container = document.getElementById('fireworksContainer');
            const colors = ['#FFD700', '#FFA500', '#FF6347', '#FF1493', '#00CED1'];
            const COUNT = 30; // Reduced for performance

            for (let i = 0; i < COUNT; i++) {
                setTimeout(() => {
                    createFirework(container, colors);
                }, i * 100);
            }
        }

        function createFirework(container, colors) {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight * 0.6;
            const particleCount = 12; // Reduced

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                const angle = (i / particleCount) * Math.PI * 2;
                const velocity = 50 + Math.random() * 100;
                particle.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`);
                particle.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`);

                container.appendChild(particle);

                setTimeout(() => particle.remove(), 1000);
            }
        }

        // Enter key support
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (!btnUnlock.disabled) {
                    btnUnlock.click();
                } else {
                    btnCheck.click();
                }
            }
        });
    </script>
</body>
</html>

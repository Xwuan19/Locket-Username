<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locket Gold - Premium Unlock</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #8b5cf6;
            --secondary: #06b6d4;
            --accent: #fbbf24;
            --bg-dark: #0f0a1e;
            --bg-mid: #1a1333;
            --glass: rgba(139, 92, 246, 0.1);
            --glass-border: rgba(139, 92, 246, 0.3);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animated {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(6, 182, 212, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* Grid Overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0) rotate(0deg);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5) rotate(360deg);
            }
        }

        /* Light Beams */
        .light-beam {
            position: fixed;
            width: 2px;
            height: 200px;
            background: linear-gradient(to bottom, transparent, var(--primary), transparent);
            opacity: 0.3;
            animation: beamMove linear infinite;
        }

        @keyframes beamMove {
            0% {
                transform: translateY(-200px) translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 100;
            max-width: 520px;
            margin: 0 auto;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo Header */
        .logo-header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease;
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #fbbf24 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 80px rgba(251, 191, 36, 0.5);
            animation: shimmer 3s linear infinite;
            position: relative;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .logo-subtitle {
            font-size: 1.1rem;
            color: #a78bfa;
            margin-top: 0.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease 0.3s both;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Animated Border */
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent), var(--primary));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Input Group */
        .input-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="text"] {
            width: 100%;
            padding: 1.25rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            color: #fff;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow:
                0 0 0 4px rgba(139, 92, 246, 0.1),
                0 0 40px rgba(139, 92, 246, 0.3);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            flex: 1;
            padding: 1.25rem 2rem;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
        }

        button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        button:hover::before {
            transform: translateX(100%);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-check {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
        }

        .btn-check:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(139, 92, 246, 0.6);
        }

        .btn-unlock {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
        }

        .btn-unlock:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(251, 191, 36, 0.6);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        /* Avatar Section */
        .avatar-section {
            display: none;
            text-align: center;
            animation: fadeInScale 0.6s ease;
        }

        .avatar-section.show {
            display: block;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        /* 3D Rotating Ring */
        .avatar-ring {
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            animation: rotate3D 4s linear infinite;
            filter: blur(8px);
        }

        @keyframes rotate3D {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: 3px;
            background: var(--bg-mid);
            border-radius: 50%;
        }

        .avatar-img {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--bg-mid);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .user-info h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info p {
            color: #a78bfa;
            font-size: 1rem;
        }

        /* Success Modal */
        .success-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        .success-modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-content {
            text-align: center;
            animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon {
            font-size: 8rem;
            margin-bottom: 2rem;
            animation: bounceIn 1s ease;
        }

        @keyframes bounceIn {
            0%, 20%, 40%, 60%, 80%, 100% {
                animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
            }
            0% {
                opacity: 0;
                transform: scale3d(0.3, 0.3, 0.3);
            }
            20% {
                transform: scale3d(1.1, 1.1, 1.1);
            }
            40% {
                transform: scale3d(0.9, 0.9, 0.9);
            }
            60% {
                opacity: 1;
                transform: scale3d(1.03, 1.03, 1.03);
            }
            80% {
                transform: scale3d(0.97, 0.97, 0.97);
            }
            100% {
                opacity: 1;
                transform: scale3d(1, 1, 1);
            }
        }

        .success-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .success-message {
            font-size: 1.3rem;
            color: #a78bfa;
            margin-bottom: 3rem;
        }

        .btn-close {
            padding: 1.25rem 3rem;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 16px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
        }

        .btn-close:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(251, 191, 36, 0.6);
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fireworks */
        .fireworks-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
        }

        @keyframes firework {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .logo-title {
                font-size: 2.5rem;
            }
            .glass-card {
                padding: 2rem 1.5rem;
            }
            .button-group {
                flex-direction: column;
            }
            .success-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animated"></div>
    <div class="grid-overlay"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Logo Header -->
        <div class="logo-header">
            <h1 class="logo-title">LOCKET GOLD</h1>
            <p class="logo-subtitle">Premium Unlock</p>
        </div>

        <!-- Glass Card -->
        <div class="glass-card">
            <!-- Input Group -->
            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter Locket username..."
                    autocomplete="off"
                >
            </div>

            <!-- Button Group -->
            <div class="button-group">
                <button class="btn-check" id="btnCheck">
                    <span id="checkText">Verify</span>
                </button>
                <button class="btn-unlock" id="btnUnlock" disabled>
                    <span id="unlockText">Unlock</span>
                </button>
            </div>

            <!-- Avatar Section -->
            <div class="avatar-section" id="avatarSection">
                <div class="avatar-wrapper">
                    <div class="avatar-ring"></div>
                    <img class="avatar-img" id="avatarImg" src="" alt="Avatar">
                </div>
                <div class="user-info">
                    <h2 id="userName"></h2>
                    <p id="userHandle"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="success-modal" id="successModal">
        <div class="fireworks-container" id="fireworksContainer"></div>
        <div class="success-content">
            <div class="success-icon">✨</div>
            <h1 class="success-title">SUCCESS!</h1>
            <p class="success-message" id="successMessage">Gold unlocked successfully!</p>
            <button class="btn-close" id="btnClose">Continue</button>
        </div>
    </div>

    <script>
        // Particles System
        const particlesContainer = document.getElementById('particles');
        const PARTICLE_COUNT = 20;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.width = `${2 + Math.random() * 4}px`;
            particle.style.height = particle.style.width;
            particle.style.animationDuration = `${10 + Math.random() * 15}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(particle);
        }

        // Light Beams
        for (let i = 0; i < 3; i++) {
            const beam = document.createElement('div');
            beam.className = 'light-beam';
            beam.style.left = `${20 + i * 30}%`;
            beam.style.animationDuration = `${8 + Math.random() * 4}s`;
            beam.style.animationDelay = `${i * 2}s`;
            particlesContainer.appendChild(beam);
        }

        // App Logic
        const usernameInput = document.getElementById('username');
        const btnCheck = document.getElementById('btnCheck');
        const btnUnlock = document.getElementById('btnUnlock');
        const checkText = document.getElementById('checkText');
        const unlockText = document.getElementById('unlockText');
        const avatarSection = document.getElementById('avatarSection');
        const avatarImg = document.getElementById('avatarImg');
        const userName = document.getElementById('userName');
        const userHandle = document.getElementById('userHandle');
        const successModal = document.getElementById('successModal');
        const successMessage = document.getElementById('successMessage');
        const btnClose = document.getElementById('btnClose');

        let currentUserData = null;

        // Check User
        btnCheck.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            if (!username) {
                alert('Please enter a username');
                return;
            }

            btnCheck.disabled = true;
            checkText.innerHTML = '<span class="spinner"></span>';

            try {
                const response = await fetch('/api/get-user-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (data.success) {
                    currentUserData = data.data;
                    avatarImg.src = data.data.profile_picture_url || 'https://via.placeholder.com/140';
                    userName.textContent = `${data.data.first_name} ${data.data.last_name}`.trim() || data.data.username;
                    userHandle.textContent = `@${data.data.username}`;
                    avatarSection.classList.add('show');
                    btnUnlock.disabled = false;
                } else {
                    alert(data.msg || 'User not found');
                    avatarSection.classList.remove('show');
                    btnUnlock.disabled = true;
                }
            } catch (err) {
                alert('Connection error. Please try again.');
                console.error(err);
            } finally {
                btnCheck.disabled = false;
                checkText.textContent = 'Verify';
            }
        });

        // Unlock Gold
        btnUnlock.addEventListener('click', async () => {
            if (!currentUserData) return;

            const username = usernameInput.value.trim();
            btnUnlock.disabled = true;
            unlockText.innerHTML = '<span class="spinner"></span>';

            try {
                const response = await fetch('/api/unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (data.success) {
                    successMessage.textContent = data.message;
                    successModal.classList.add('show');
                    launchFireworks();
                } else {
                    alert(data.message || 'Unlock failed');
                }
            } catch (err) {
                alert('Connection error. Please try again.');
                console.error(err);
            } finally {
                btnUnlock.disabled = false;
                unlockText.textContent = 'Unlock';
            }
        });

        // Close Success Modal
        btnClose.addEventListener('click', () => {
            successModal.classList.remove('show');
            usernameInput.value = '';
            avatarSection.classList.remove('show');
            btnUnlock.disabled = true;
            currentUserData = null;
        });

        // Fireworks Effect
        function launchFireworks() {
            const container = document.getElementById('fireworksContainer');
            const colors = ['#8b5cf6', '#06b6d4', '#fbbf24', '#f59e0b', '#ec4899'];

            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.7;

                    for (let j = 0; j < 12; j++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework';
                        particle.style.left = x + 'px';
                        particle.style.top = y + 'px';
                        particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                        const angle = (j / 12) * Math.PI * 2;
                        const velocity = 80 + Math.random() * 120;
                        particle.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`);
                        particle.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`);

                        container.appendChild(particle);
                        setTimeout(() => particle.remove(), 1000);
                    }
                }, i * 80);
            }
        }

        // Enter key support
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (!btnUnlock.disabled) {
                    btnUnlock.click();
                } else {
                    btnCheck.click();
                }
            }
        });
    </script>
</body>
</html>

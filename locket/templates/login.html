<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Code Required · Locket Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #FFD700;
            --gold-light: #FFE55C;
            --bg: #050505;
            --card: rgba(16, 16, 16, 0.85);
            --text: #fff;
            --glass: 1px solid rgba(255,215,0,0.15);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg-glow .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .3;
            animation: drift 18s ease-in-out infinite alternate;
        }
        .bg-glow .orb:nth-child(1) {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(255,215,0,.4), transparent 70%);
            top: -10%;
            left: -5%;
        }
        .bg-glow .orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,180,0,.25), transparent 70%);
            bottom: -8%;
            right: -5%;
            animation-delay: -7s;
            animation-duration: 20s;
        }
        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            50%  { transform: translate(30px,-20px) scale(1.1); }
            100% { transform: translate(-15px,15px) scale(.95); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: var(--card);
            backdrop-filter: blur(24px);
            border: var(--glass);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: .5rem;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #999;
            margin-bottom: 2rem;
            font-size: .95rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: .9rem;
            margin-bottom: .5rem;
            color: #ccc;
        }

        input[type="password"] {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,215,0,.2);
            border-radius: .75rem;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all .3s ease;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,.08);
            box-shadow: 0 0 0 3px rgba(255,215,0,.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border: none;
            border-radius: .75rem;
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .3s ease;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255,215,0,.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #ff6b6b;
            font-size: .9rem;
            margin-top: 1rem;
            display: none;
        }

        .error.show {
            display: block;
            animation: shake .4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="bg-glow">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="login-card">
        <div class="logo">🔒</div>
        <h1>Access Code Required</h1>
        <p>Enter the access code to continue</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="password">Access Code</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter access code"
                    autocomplete="off"
                    required
                >
            </div>
            <button type="submit" id="submitBtn">Unlock</button>
            <div class="error" id="error"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = passwordInput.value.trim();
            if (!password) return;

            // Disable form
            submitBtn.disabled = true;
            submitBtn.textContent = 'Checking...';
            errorDiv.classList.remove('show');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    // Success - reload to show main page
                    window.location.reload();
                } else {
                    // Show error
                    errorDiv.textContent = data.error || 'Invalid access code';
                    errorDiv.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Unlock';
            }
        });

        // Focus password input on load
        passwordInput.focus();
    </script>
</body>
</html>
